<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="medBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="cyanSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Tooth + Smile Arc + Sparkle) -->
  <g transform="translate(10, 5)" filter="url(#softGlow)">
    <!-- Background subtle circle halo -->
    <circle cx="30" cy="30" r="28" fill="#F0F9FF" />
    
    <!-- Stylized Modern Tooth -->
    <!-- Left Root & Crown -->
    <path d="M 22 14 
             C 14 14, 11 20, 11 28 
             C 11 36, 17 44, 21 52 
             C 22.5 55, 25 54, 25.5 51 
             C 26.5 45, 27.5 39, 29 36 
             C 29.5 35, 30.5 35, 31 36 
             C 32.5 39, 33.5 45, 34.5 51 
             C 35 54, 37.5 55, 39 52 
             C 43 44, 49 36, 49 28 
             C 49 20, 46 14, 38 14 
             C 33 14, 31 17, 30 17 
             C 29 17, 27 14, 22 14 Z" 
          fill="url(#medBlueGrad)" />

    <!-- Aesthetic Smile / Care Ribbon Flow -->
    <path d="M 17 28 
             C 23 35, 37 35, 43 28 
             C 41 33, 35 38, 30 38 
             C 25 38, 19 33, 17 28 Z" 
          fill="#38BDF8" 
          opacity="0.9" />

    <!-- Pure White Inner Reflection / Enamel Highlight -->
    <path d="M 23 18 
             C 18 18, 16 22, 16 27 
             C 16 32, 19 37, 22 41 
             C 21.5 37, 20.5 30, 24 24 
             C 26 21, 28 20, 30 20 
             C 28 18.5, 25.5 18, 23 18 Z" 
          fill="#FFFFFF" 
          opacity="0.75" />

    <!-- Dental Health Star / Sparkle (Top-Right) -->
    <path d="M 44 14 
             Q 44 8 47 8 
             Q 44 8 44 2 
             Q 44 8 41 8 
             Q 44 8 44 14 Z" 
          fill="#0284C7" />
    <circle cx="44" cy="8" r="1.5" fill="#38BDF8" />

    <!-- Accent Dot -->
    <circle cx="49" cy="16" r="1" fill="#38BDF8" />
  </g>

  <!-- ARABIC BRAND TYPOGRAPHY (RTL layout: Tooth on right or left, aligned for elegant medical header) -->
  <g transform="translate(82, 0)">
    <!-- Primary Name: د. حملاوي حنان -->
    <text x="0" y="34" 
          font-family="'Tajawal', 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" 
          font-size="22" 
          font-weight="800" 
          fill="#0F2744" 
          letter-spacing="0">
      د. حملاوي حنان
    </text>

    <!-- Subtitle / Specialty: مختصة في طب وجراحة الأسنان -->
    <text x="0" y="52" 
          font-family="'Tajawal', 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif" 
          font-size="12.5" 
          font-weight="600" 
          fill="#0284C7" 
          letter-spacing="0.2">
      مختصة في طب وجراحة الأسنان
    </text>

    <!-- Medical Accent Line -->
    <rect x="0" y="58" width="60" height="2.5" rx="1.25" fill="#38BDF8" />
  </g>
</svg>
